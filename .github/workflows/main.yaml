name: "Create artifacts"

on: "workflow_dispatch"

jobs:
  build:
    strategy:
      matrix:
        arch: ["amd64", "arm64"]
        os: ["linux", "darwin", "windows"]
    timeout-minutes: 15
    name: "Create artifacts"
    runs-on: "ubuntu-latest"
    env:
      GOARCH: ${{ matrix.arch }}
      GOOS: ${{ matrix.os }}

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-go@v7"
        with:
          go-version: "1.26"
          # Treesitter downloads specific libraries per OS. setup-go doesn't
          # really vibe with this so just disable the cache
          cache: false

      - run: "make build"
      - uses: "actions/upload-artifact@v7"
        with:
          name: "welp-${{ matrix.os }}-${{ matrix.arch }}"
          path: "out/welp"
