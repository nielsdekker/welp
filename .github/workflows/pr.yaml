name: "PR Validate"

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    timeout-minutes: 15
    name: "Run tests"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-go@v7"
        with:
          go-version: "1.26"

      - run: "make test"
